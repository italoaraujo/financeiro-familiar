services:
  postgres:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-financial}-postgres
    profiles: ["db"]
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:?Variavel DB_USER obrigatoria}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Variavel DB_PASSWORD obrigatoria}
      POSTGRES_DB: ${DB_NAME:-financial_db}
      TZ: ${TZ:-America/Sao_Paulo}
      PGTZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-${DB_PORT:-5432}}:5432"
    volumes:
      - ${PGDATA_PATH:-./pgdata}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:?Variavel DB_USER obrigatoria} -d ${DB_NAME:-financial_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-financial}-api
    profiles: ["app"]
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      APP_ENV: ${APP_ENV:-development}
      PORT: 3001
      TZ: ${TZ:-America/Sao_Paulo}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${DB_USER:?Variavel DB_USER obrigatoria}:${DB_PASSWORD:?Variavel DB_PASSWORD obrigatoria}@${DB_HOST:-postgres}:${DB_PORT:-5432}/${DB_NAME:-financial_db}?schema=public}
      JWT_SECRET: ${JWT_SECRET:?Variavel JWT_SECRET obrigatoria}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-1d}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
      DISABLE_REGISTRATION: ${DISABLE_REGISTRATION:-false}
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${API_PORT:-${PORT:-3001}}:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_ENV: ${APP_ENV:-development}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
        NEXT_PUBLIC_DISABLE_REGISTRATION: ${DISABLE_REGISTRATION:-false}
    container_name: ${COMPOSE_PROJECT_NAME:-financial}-frontend
    profiles: ["app"]
    restart: always
    depends_on:
      api:
        condition: service_healthy
        required: false
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: 3000
      TZ: ${TZ:-America/Sao_Paulo}
      NEXT_PUBLIC_APP_ENV: ${APP_ENV:-development}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      NEXT_PUBLIC_DISABLE_REGISTRATION: ${DISABLE_REGISTRATION:-false}
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  mcp:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-financial}-mcp
    profiles: ["mcp", "all"]
    restart: always
    depends_on:
      api:
        condition: service_healthy
        required: false
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      TZ: ${TZ:-America/Sao_Paulo}
      MCP_TRANSPORT: ${MCP_TRANSPORT:-http}
      MCP_HTTP_PORT: 3333
      MCP_HTTP_HOST: "0.0.0.0"
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-}
      MCP_API_URL: ${MCP_API_URL:-http://api:3001}
      MCP_API_TOKEN: ${MCP_API_TOKEN:-}
      MCP_USER_EMAIL: ${MCP_USER_EMAIL:-}
      MCP_USER_PASSWORD: ${MCP_USER_PASSWORD:-}
      MCP_DEFAULT_FAMILY_ID: ${MCP_DEFAULT_FAMILY_ID:-}
      MCP_HTTP_TIMEOUT_MS: ${MCP_HTTP_TIMEOUT_MS:-15000}
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${MCP_PORT:-3333}:3333"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3333/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

networks:
  default:
    name: ${COMPOSE_PROJECT_NAME:-financial}_default